name: Build SiteCam APK

# Every push to any branch builds a signed APK and publishes it as a new
# GitHub Release, so the newest version is always at the top of the Releases page.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew --stacktrace assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SiteCam-${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=dist/SiteCam-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: SiteCam-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.file }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          printf 'Built from branch `%s` (commit %s).\n\nOn your phone: tap **SiteCam-%s.apk** below, then open the download to install or update.\n' \
            "${BRANCH}" "${SHORT_SHA}" "${VERSION}" > release-notes.md
          gh release create "v${VERSION}" "${APK}" \
            --target "${GITHUB_SHA}" \
            --title "SiteCam ${VERSION}" \
            --notes-file release-notes.md \
            --latest
