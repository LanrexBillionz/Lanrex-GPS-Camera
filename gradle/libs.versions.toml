[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.10"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigation = "2.9.8"
work = "2.11.2"
room = "2.8.4"
